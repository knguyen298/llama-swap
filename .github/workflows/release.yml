name: goreleaser

on:
  push:
    tags:
      - "*"

  # Allows manual triggering of the workflow
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version to release (e.g. v144)"
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #6.4.0
        with:
          go-version-file: go.mod
      - name: Extract release notes from changelog/${{ github.event.inputs.tag || github.ref_name }}.md
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          # each release is one file; drop the leading "## <tag>" heading
          if [ -f "changelog/${TAG}.md" ]; then
            tail -n +2 "changelog/${TAG}.md" > "${NOTES}"
          else
            : > "${NOTES}"
          fi

          if ! grep -q '[^[:space:]]' "${NOTES}"; then
            echo "::error::no changelog/${TAG}.md entry for ${TAG}, run make release to generate it"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: "24"
      - name: Build UI
        run: |
          make ui

      - name: Copy source for the code tools
        run: |
          make src

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 #7.2.1
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
